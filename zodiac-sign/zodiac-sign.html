<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stjärntecken – Ta-reda-på-läxa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F1EEFA; --ink:#1F2557; --soft:#545C8F; --card:#FFFFFF; --line:#D8DBF3;
  --sky:#1A2150; --sky-deep:#0F1538; --gold:#FFCF4D; --coral:#FF7F86; --mint:#57D1B8;
  --on-sky:#F4F2FF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#121735; --ink:#F3F1FF; --soft:#AEB3DA; --card:#1C2350; --line:#2E3670;
  }
}
:root[data-theme="dark"]{
  --page:#121735; --ink:#F3F1FF; --soft:#AEB3DA; --card:#1C2350; --line:#2E3670;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--page);color:var(--ink);
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:1.125rem;line-height:1.6;
  display:flex;flex-direction:column;
}
h1,h2,.fred{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-weight:600;line-height:1.15;margin:0}
h1{font-size:clamp(2.2rem,6vw,3.6rem)}
h2{font-size:clamp(1.7rem,4.5vw,2.5rem);margin-bottom:.6rem}
p{margin:0 0 .9rem;max-width:34em}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:8px}

header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem 1rem;padding:.9rem 1.25rem;padding-top:calc(.9rem + env(safe-area-inset-top,0px))}
header .langbar{margin-bottom:0;order:3;flex:1 1 100%;justify-content:flex-end}
@media (min-width:560px){header .langbar{flex:0 0 auto;order:0}}
header .lb{font-size:.85rem;padding:.28rem .75rem}
.brand{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:1.05rem;color:var(--soft)}
.dots{display:flex;gap:.45rem}
.dots button{width:12px;height:12px;border-radius:50%;border:2px solid var(--soft);background:transparent;padding:0;cursor:pointer}
.dots button[aria-current="step"]{background:var(--gold);border-color:var(--gold);transform:scale(1.25)}

main{flex:1;overflow:auto;padding:0 1.25rem}
.slide{display:none;min-height:100%;align-items:center;justify-content:center;gap:2.5rem;padding:1rem 0 2rem;max-width:1080px;margin:0 auto}
.slide.active{display:flex}
.text{flex:1 1 360px;min-width:0;display:flex;flex-direction:column}
.stage{flex:0 1 460px;width:100%;max-width:460px}
@media (max-width:760px){
  .slide{flex-direction:column;gap:1.25rem}
  .stage{max-width:400px;flex-basis:auto}
  .slide[data-title="The Sun's path"] .now{order:-2;margin-top:0}
  .slide[data-title="The Sun's path"] .controls{order:-1}
  .slide[data-title="The Sun's path"] h2{margin-top:1.85rem;padding-top:1.85rem;border-top:2px solid var(--line)}
}

.sky{
  position:relative;aspect-ratio:1;width:100%;border-radius:32px;overflow:hidden;
  background:
    radial-gradient(circle at 30% 20%, #2B3580 0, transparent 60%),
    linear-gradient(160deg,var(--sky),var(--sky-deep));
  color:var(--on-sky);
  box-shadow:0 18px 40px -18px #0F153899;
}
.sky::before,.sky::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 78% 12%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 64% 78%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 66%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 90% 52%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 44% 38%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 8% 88%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 55% 6%,#fff 50%,transparent 51%);
}
.sky::after{transform:translate(9%,23%);opacity:.6;animation:twinkle 3.2s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15}to{opacity:.8}}

.btn{
  display:inline-flex;align-items:center;gap:.5rem;border:none;cursor:pointer;
  background:var(--gold);color:#1F2557;font-family:"Fredoka",system-ui,sans-serif;font-weight:600;
  font-size:1.1rem;padding:.7rem 1.4rem;border-radius:999px;box-shadow:0 4px 0 #D9A620;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D9A620}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn[disabled]{opacity:.35;cursor:default}

footer{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.25rem 1rem;border-top:2px solid var(--line)}

/* hero */
.hero-ring text{font-size:30px}
.spin{transform-origin:200px 200px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-title{fill:var(--on-sky);font-family:"Fredoka",system-ui,sans-serif;font-weight:700}

/* connect the dots */
.star{fill:#fff}
.star.big{fill:var(--gold)}
.link{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.play .link{animation:draw .7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ghost-lion{opacity:0;font-size:190px}
.play .ghost-lion{animation:fadein 1.2s ease-out 4.6s forwards}
.leo-label{opacity:0;fill:var(--gold);font-family:"Fredoka",system-ui,sans-serif;font-size:30px;font-weight:600}
.play .leo-label{animation:fadein .8s ease-out 5.2s forwards}
@keyframes fadein{to{opacity:1}}
.ghost-lion.show{opacity:.22}

/* orbit */
.ring-sign{font-size:24px;transition:font-size .25s}
.ring-sign.on{font-size:38px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;margin-top:1rem}
.controls input[type=range]{flex:1 1 200px;accent-color:var(--coral)}
.now{
  margin-top:1rem;padding:1rem 1.2rem;border-radius:20px;background:var(--card);
  border:2px solid var(--line);
}
.now strong{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:1.3rem}

/* wheel */
.wheel{position:relative;aspect-ratio:1;width:100%}
.wheel .spot{
  position:absolute;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;border:none;cursor:pointer;background:#2A3478;
  font-size:clamp(1.4rem,5vw,2rem);display:grid;place-items:center;transition:transform .2s,background .2s;
}
.wheel .spot:hover{transform:translate(-50%,-50%) scale(1.1)}
.wheel .spot[aria-pressed="true"]{background:var(--gold);transform:translate(-50%,-50%) scale(1.18)}
.hub{position:absolute;inset:30%;border-radius:50%;display:grid;place-items:center;text-align:center;pointer-events:none}
.hub .e{font-size:clamp(2.6rem,10vw,4rem);line-height:1}
.hub .n{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:1.2rem}
.info{padding:1.2rem 1.4rem;border-radius:24px;background:var(--card);border:2px solid var(--line)}
.info .sym{font-size:1.6rem;color:var(--coral);font-family:"Fredoka",system-ui,sans-serif}
.dates{color:var(--soft);font-weight:700;margin-bottom:.4rem}

/* finder */
.pick{display:flex;flex-wrap:wrap;gap:.8rem;align-items:end;margin:1rem 0}
.pick label{display:flex;flex-direction:column;font-weight:700;font-size:.95rem;color:var(--soft)}
.pick select{margin-top:.3rem;padding:.55rem .8rem;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.05rem}
.reveal{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:1.5rem}
.reveal .big{font-size:clamp(4.5rem,20vw,8rem);line-height:1}
.reveal .nm{font-family:"Fredoka",system-ui,sans-serif;font-weight:700;font-size:clamp(2rem,7vw,2.8rem);color:var(--gold)}
.reveal .sub{font-size:1rem;opacity:.9}
.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.burst circle{animation:burst 1s ease-out forwards}
@keyframes burst{from{r:4;opacity:1}to{r:190;opacity:0}}

/* facts */
.facts{display:grid;gap:1rem;margin-top:1rem}
.fact{padding:1rem 1.2rem;border-radius:20px;background:var(--card);border-left:6px solid var(--mint)}
.fact:nth-child(2){border-left-color:var(--coral)}
.fact:nth-child(3){border-left-color:var(--gold)}
.fact b{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:1.15rem;display:block}
.fact p{margin:0}

/* ---------- läxa / homework ---------- */
.slide.wide{flex-direction:column;align-items:stretch;justify-content:flex-start;max-width:1120px;gap:0}
.slide.wide .col{flex:1 1 auto;width:100%;min-width:0}
.slide.wide p{max-width:62ch}
.langbar{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem}
.lb{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.3rem .9rem;font-weight:700;font-size:.95rem;cursor:pointer}
.lb[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.qlist{display:grid;gap:.55rem;padding:0;margin:1rem 0 1.3rem;list-style:none}
.qlist li{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:.65rem .95rem}
.num{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--gold);color:#1F2557;display:grid;place-items:center;font-family:"Fredoka",system-ui,sans-serif;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.3rem 0 1.1rem}
.chip{display:flex;align-items:center;gap:.4rem;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.3rem .8rem;font-size:.98rem;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1F2557}
.chip .em{font-size:1.15rem}
.sheet{display:grid;grid-template-columns:minmax(250px,360px) 1fr;gap:1.4rem;align-items:start}
@media (max-width:860px){.sheet{grid-template-columns:1fr}}
.mapcap{font-size:.9rem;color:var(--soft);margin:.6rem 0 .6rem;max-width:none}
.maplabel{fill:var(--gold);font-family:"Fredoka",system-ui,sans-serif;font-size:15px}
.mapname{fill:var(--on-sky);font-family:"Fredoka",system-ui,sans-serif;font-size:20px;opacity:.92}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:1rem 1.2rem;margin-bottom:1rem}
.qcard h3{display:flex;gap:.7rem;align-items:flex-start;font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:1.12rem;line-height:1.3;margin:0 0 .65rem}
.qcard p{margin:0 0 .6rem;max-width:none}
.qcard p:last-child{margin-bottom:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem .8rem;margin:0 0 .7rem}
.kv dt{color:var(--soft);font-weight:700}
.kv dd{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .7rem}
.tag{background:var(--page);border:2px solid var(--line);border-radius:999px;padding:.18rem .7rem;font-weight:700;font-size:.95rem}
.swatch{display:inline-block;width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--line);vertical-align:-.3rem;margin-right:.4rem}
.note{font-size:.92rem;color:var(--soft);border-left:4px solid var(--mint);padding-left:.75rem;margin:.7rem 0 0}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:760px){.twocol{grid-template-columns:1fr}}
.bullets{margin:0;padding-left:1.1rem}
.bullets li{margin-bottom:.45rem}
.write{width:100%;min-height:9rem;border:2px dashed var(--line);border-radius:18px;background:var(--card);padding:.9rem 1rem;font:inherit;color:inherit;resize:vertical}
.starter{font-size:.95rem;color:var(--soft)}
.srcs{display:grid;gap:.5rem;padding:0;margin:.4rem 0 0;list-style:none}
.srcs li{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:.55rem .9rem;font-size:.97rem;word-break:break-word}
.check{display:grid;gap:.5rem;padding:0;margin:.5rem 0 0;list-style:none}
.check li{display:flex;gap:.6rem;align-items:flex-start}
.check input{width:1.2rem;height:1.2rem;accent-color:var(--mint);margin-top:.2rem}
.print-only{display:none}

@media print{
  @page{margin:14mm}
  header,footer,.no-print{display:none!important}
  body{background:#fff;color:#000;display:block;height:auto;font-size:10.5pt}
  main{overflow:visible;padding:0}
  .slide{display:none!important}
  .slide.printable{display:block!important;min-height:0;max-width:none;padding:0;margin:0 0 6mm}
  .sheet,.twocol{display:block}
  .mapbox{width:70mm;float:right;margin:0 0 4mm 6mm}
  .swatch{display:none}
  #myAnswerPrint{min-height:38mm;border:1px solid #888;border-radius:3mm;padding:3mm;white-space:pre-wrap}
  .sky{background:#fff!important;color:#000!important;box-shadow:none;border:1px solid #777;border-radius:10px}
  .sky::before,.sky::after{display:none}
  .star,.star.big{fill:#000!important}
  .link{stroke:#444!important;stroke-dasharray:none!important;stroke-dashoffset:0!important;animation:none!important}
  .maplabel,.mapname{fill:#000!important}
  .qcard,.srcs li{background:#fff!important;border:1px solid #888;break-inside:avoid;page-break-inside:avoid}
  .tag,.num,.swatch{background:#fff!important;color:#000!important;border:1px solid #888}
  h2{font-size:15pt}
  .write{display:none}
  .print-only{display:block}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .spin{animation:none}
}
</style>
</head>
<body>
<header>
  <span class="brand">✨ Star Stories</span>
  <nav class="dots" id="dots" aria-label="Chapters"></nav>
  <div class="langbar">
    <button class="lb" id="lbSv" aria-pressed="true">Svenska</button>
    <button class="lb" id="lbEn" aria-pressed="false">English</button>
  </div>
</header>

<main>
  <!-- 1 -->
  <section class="slide" data-title="Welcome">
    <div class="stage">
      <div class="sky">
        <svg viewBox="0 0 400 400" width="100%" height="100%" aria-hidden="true">
          <g class="spin hero-ring" id="heroRing"></g>
          <text class="hero-title" x="200" y="190" text-anchor="middle" font-size="44">12</text>
          <text class="hero-title" x="200" y="228" text-anchor="middle" font-size="22" data-sv="stjärnbilder" data-en="star pictures"></text>
        </svg>
      </div>
    </div>
    <div class="text">
      <h1 data-sv="Vad är ett stjärntecken?" data-en="What is a zodiac sign?"></h1>
      <p data-sv="Har du någonsin hört någon säga ”Jag är Lejonet!” eller ”Hon är Fiskarna”? Det är stjärntecken." data-en="Have you ever heard someone say “I’m a Leo!” or “She’s a Pisces”? Those are zodiac signs."></p>
      <p data-sv="Det finns 12 stycken, och varje ett är en bild gjord av stjärnor. Nu ska vi ta reda på var de kommer ifrån, och vilket som är ditt." data-en="There are 12 of them, and each one is a picture made of stars. Let’s find out where they come from, and which one is yours."></p>
      <button class="btn" data-next data-sv="Börja berättelsen" data-en="Start the story"></button>
    </div>
  </section>

  <!-- 2 -->
  <section class="slide" data-title="Dot to dot">
    <div class="stage">
      <div class="sky" id="leoSky">
        <svg viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="Stars being joined into the shape of Leo the lion" id="leoSvg">
          <text class="ghost-lion" x="215" y="280" text-anchor="middle">🦁</text>
          <path class="link" pathLength="1" d="M95 125 L128 105" style="animation-delay:.2s"/>
          <path class="link" pathLength="1" d="M128 105 L168 130" style="animation-delay:.8s"/>
          <path class="link" pathLength="1" d="M168 130 L175 180" style="animation-delay:1.4s"/>
          <path class="link" pathLength="1" d="M175 180 L135 215" style="animation-delay:2s"/>
          <path class="link" pathLength="1" d="M135 215 L120 270" style="animation-delay:2.6s"/>
          <path class="link" pathLength="1" d="M175 180 L300 175" style="animation-delay:3s"/>
          <path class="link" pathLength="1" d="M300 175 L350 235" style="animation-delay:3.4s"/>
          <path class="link" pathLength="1" d="M350 235 L290 245" style="animation-delay:3.7s"/>
          <path class="link" pathLength="1" d="M290 245 L120 270" style="animation-delay:4s"/>
          <path class="link" pathLength="1" d="M290 245 L300 175" style="animation-delay:4.3s"/>
          <circle class="star" cx="95" cy="125" r="4"/>
          <circle class="star" cx="128" cy="105" r="4"/>
          <circle class="star" cx="168" cy="130" r="5"/>
          <circle class="star big" cx="175" cy="180" r="6"/>
          <circle class="star" cx="135" cy="215" r="4"/>
          <circle class="star big" cx="120" cy="270" r="8"/>
          <circle class="star" cx="300" cy="175" r="5"/>
          <circle class="star big" cx="350" cy="235" r="7"/>
          <circle class="star" cx="290" cy="245" r="5"/>
          <text class="leo-label" x="200" y="350" text-anchor="middle" data-sv="Lejonet" data-en="Leo the Lion"></text>
        </svg>
      </div>
    </div>
    <div class="text">
      <h2 data-sv="Stjärnorna är ett jättelikt prick-till-prick" data-en="Stars are a giant dot-to-dot"></h2>
      <p data-sv="För tusentals år sedan fanns det inga skärmar och ingen gatubelysning. På natten var himlen full av stjärnor, och människor älskade att berätta historier om dem." data-en="Thousands of years ago there were no screens and no street lights. At night the sky was full of stars, and people loved telling stories about them."></p>
      <p data-sv="De band ihop klara stjärnor med tänkta linjer, som ett prick-till-prick-pussel, och såg djur och hjältar. En sådan bild av stjärnor kallas en <b>stjärnbild</b>." data-en="They joined bright stars with imaginary lines, like a dot-to-dot puzzle, and saw animals and heroes. A star picture is called a <b>constellation</b>."></p>
      <button class="btn ghost" id="replayLeo" data-sv="Rita igen" data-en="Draw it again"></button>
    </div>
  </section>

  <!-- 3 -->
  <section class="slide" data-title="The Sun's path">
    <div class="stage">
      <div class="sky">
        <svg viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="Earth moving around the Sun, with the 12 zodiac constellations in a ring around them" id="orbitSvg">
          <circle cx="200" cy="200" r="92" fill="none" stroke="#ffffff40" stroke-width="2" stroke-dasharray="4 6"/>
          <line id="sightLine" x1="0" y1="0" x2="0" y2="0" stroke="var(--gold)" stroke-width="2.5" stroke-dasharray="6 6" opacity=".9"/>
          <g id="orbitRing"></g>
          <circle cx="200" cy="200" r="30" fill="var(--gold)"/>
          <text x="200" y="210" text-anchor="middle" font-size="28">☀️</text>
          <g id="earth"><circle r="15" fill="#4F9BF0"/><text y="7" text-anchor="middle" font-size="20">🌍</text></g>
        </svg>
      </div>
    </div>
    <div class="text">
      <h2 data-sv="Solens väg genom stjärnorna" data-en="The Sun’s path through the stars"></h2>
      <p data-sv="Vår jord reser hela vägen runt solen en gång om året. När vi rör oss verkar solen stå framför olika stjärnbilder bakom den." data-en="Our Earth travels all the way around the Sun once every year. As we move, the Sun seems to sit in front of different star pictures behind it."></p>
      <p data-sv="Människor upptäckte 12 stjärnbilder längs solens väg. Den ringen av 12 kallas <b>zodiaken</b>. Varje bild får ungefär en månad." data-en="People noticed 12 star pictures along the Sun’s path. That ring of 12 is called the <b>zodiac</b>. Each picture gets about one month."></p>
      <div class="controls">
        <button class="btn" id="playBtn">Pause</button>
        <input type="range" id="daySlider" min="0" max="364" value="0" aria-label="Move through the year">
      </div>
      <div class="now" aria-live="polite">
        <span id="nowDate">Jan 1</span><span data-sv=": solen står framför " data-en=": the Sun is in front of "></span><strong id="nowSign">Capricorn</strong>
      </div>
    </div>
  </section>

  <!-- 4 -->
  <section class="slide" data-title="Meet all 12">
    <div class="stage">
      <div class="sky">
        <div class="wheel" id="wheel">
          <div class="hub"><div><div class="e" id="hubE">🐏</div><div class="n" id="hubN">Aries</div></div></div>
        </div>
      </div>
    </div>
    <div class="text">
      <h2 data-sv="Möt alla 12 tecken" data-en="Meet all 12 signs"></h2>
      <p data-sv="Tryck på en bild i ringen för att möta den." data-en="Tap a picture in the ring to meet it."></p>
      <div class="info" aria-live="polite">
        <div class="sym" id="infoSym"></div>
        <div class="dates" id="infoDates"></div>
        <p id="infoFact" style="margin:0"></p>
      </div>
    </div>
  </section>

  <!-- 5 -->

<script>
/* language state is read up front so every slide (not just the homework ones) can use it immediately */
let lang="sv";
try{ lang = localStorage.getItem("zodiac-lang")==="en" ? "en" : "sv"; }catch(e){}

const SIGNS = [
  {n:"Aries",e:"🐏",s:"♈",d:"March 21 – April 19",m:3,day:21,f:"A ram with golden wool, from an old Greek story."},

  {n:"Scorpio",e:"🦂",s:"♏",d:"October 23 – November 21",m:10,day:23,f:"A scorpion with a red star, Antares, glowing where its heart is."},

  {n:"Capricorn",e:"🐐",s:"♑",d:"December 22 – January 19",m:12,day:22,f:"A goat with a fish’s tail. Silly, but that’s the story!"},
  {n:"Aquarius",e:"🏺",s:"♒",d:"January 20 – February 18",m:1,day:20,f:"A person pouring water from a big jar."},
  {n:"Pisces",e:"🐟",s:"♓",d:"February 19 – March 20",m:2,day:19,f:"Two fish tied together with a ribbon so they don’t get lost."}
];
const FACTS_SV = [
  "En bagge med gyllene ull, från en gammal grekisk saga.",
  "En tjur. Leta efter en klarorange stjärna som heter Aldebaran, tjurens öga!",
  "Tvillingbröder. Två klara stjärnor sida vid sida är deras huvuden.",
  "En krabba. Dess stjärnor är svaga, så den är svårast att hitta.",
  "Ett lejon. Huvudet ser ut som ett bakvänt frågetecken.",
  "En ung kvinna som håller i vete. Hennes klaraste stjärna heter Spica.",
  "En vågskål, det enda tecknet som inte är en levande varelse.",
  "En skorpion med en röd stjärna, Antares, som lyser där hjärtat sitter.",
  "En bågskytt som är halv häst. Vissa tycker att den ser ut som en tekanna!",
  "En get med en fiskstjärt. Lite fånigt, men så är berättelsen!",
  "En person som häller vatten ur en stor kruka.",
  "Två fiskar som är hopbundna med ett band så att de inte tappar bort varandra."
];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_SV=["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];
const MONTHS_SV_ABBR=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const MDAYS=[31,29,31,30,31,30,31,31,30,31,30,31];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const NS="http://www.w3.org/2000/svg";

function signFor(m,d){
  const v=m*100+d; let best=null, bv=-1;
  SIGNS.forEach((s,i)=>{const sv=s.m*100+s.day; if(sv<=v && sv>bv){bv=sv;best=i;}});
  return best===null?9:best;
}

/* slides */
const slides=[...document.querySelectorAll(".slide")];
const dots=document.getElementById("dots");
let cur=0;
slides.forEach((s,i)=>{
  const b=document.createElement("button");
  b.setAttribute("aria-label",`Chapter ${i+1}: ${s.dataset.title}`);
  b.onclick=()=>go(i); dots.appendChild(b);
});
function go(i){
  cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,j)=>s.classList.toggle("active",j===cur));
  [...dots.children].forEach((b,j)=>{ if(j===cur) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current"); });
  document.getElementById("backBtn").disabled = cur===0;
  document.getElementById("nextBtn").textContent = cur===slides.length-1 ? NAV.again[lang] : NAV.next[lang];
  document.querySelector("main").scrollTop=0;
  if(cur===1) playLeo();
}
document.getElementById("backBtn").onclick=()=>go(cur-1);
document.getElementById("nextBtn").onclick=()=>go(cur===slides.length-1?0:cur+1);
document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>go(cur+1));
addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight")go(cur+1);
  if(e.key==="ArrowLeft")go(cur-1);
});

/* hero ring */
const hero=document.getElementById("heroRing");
SIGNS.forEach((s,i)=>{
  const a=(90-i*30)*Math.PI/180, t=document.createElementNS(NS,"text");
  t.setAttribute("x",200+140*Math.cos(a)); t.setAttribute("y",200-140*Math.sin(a)+10);
  t.setAttribute("text-anchor","middle"); t.textContent=s.e; hero.appendChild(t);
});

/* leo */
const leoSky=document.getElementById("leoSky");
function playLeo(){
  leoSky.classList.remove("play"); void leoSky.offsetWidth; leoSky.classList.add("play");
}
document.getElementById("replayLeo").onclick=playLeo;

/* orbit */
const ring=document.getElementById("orbitRing"), ringEls=[];
SIGNS.forEach((s,i)=>{
  const a=(90-i*30)*Math.PI/180, t=document.createElementNS(NS,"text");
  t.setAttribute("x",200+165*Math.cos(a)); t.setAttribute("y",200-165*Math.sin(a)+8);
  t.setAttribute("text-anchor","middle"); t.setAttribute("class","ring-sign"); t.textContent=s.e;
  ring.appendChild(t); ringEls.push(t);
});
const earth=document.getElementById("earth"), sight=document.getElementById("sightLine");
const slider=document.getElementById("daySlider"), playBtn=document.getElementById("playBtn");
const MLEN=[31,28,31,30,31,30,31,31,30,31,30,31];
function dayToDate(t){let m=0; t=Math.floor(t); while(t>=MLEN[m]){t-=MLEN[m];m++;} return [m+1,t+1];}
let day=0, playing=!reduce, last=null;
function updatePlayLabel(){
  playBtn.textContent = playing ? (lang==="sv"?"Pausa":"Pause") : (lang==="sv"?"Spela":"Play");
}
function drawOrbit(){
  const sunAng=(105-((day-79)/365)*360)*Math.PI/180, ea=sunAng+Math.PI;
  const ex=200+92*Math.cos(ea), ey=200-92*Math.sin(ea);
  earth.setAttribute("transform",`translate(${ex} ${ey})`);
  sight.setAttribute("x1",ex); sight.setAttribute("y1",ey);
  sight.setAttribute("x2",200+150*Math.cos(sunAng)); sight.setAttribute("y2",200-150*Math.sin(sunAng));
  const [m,d]=dayToDate(day), idx=signFor(m,d);
  ringEls.forEach((el,i)=>el.classList.toggle("on",i===idx));
  const nm = lang==="sv"?HW[idx].sv.n:SIGNS[idx].n;
  const abbr = lang==="sv"?MONTHS_SV_ABBR[m-1]:MONTHS[m-1].slice(0,3);
  document.getElementById("nowDate").textContent=`${abbr} ${d}`;
  document.getElementById("nowSign").textContent=`${nm} ${SIGNS[idx].e}`;
  slider.value=Math.floor(day);
}
function tick(ts){
  if(playing && last!==null && cur===2){ day=(day+(ts-last)/1000*15)%365; drawOrbit(); }
  last=ts; requestAnimationFrame(tick);
}
playBtn.onclick=()=>{playing=!playing; updatePlayLabel();};
slider.oninput=()=>{day=+slider.value; playing=false; updatePlayLabel(); drawOrbit();};

/* wheel */
const wheel=document.getElementById("wheel"), spots=[];
function pickSign(i){
  wheelIdx=i;
  const s=SIGNS[i];
  const nm = lang==="sv"?HW[i].sv.n:SIGNS[i].n;
  const dt = lang==="sv"?HW[i].sv.d:SIGNS[i].d;
  const fact = lang==="sv"?FACTS_SV[i]:SIGNS[i].f;
  spots.forEach((b,j)=>b.setAttribute("aria-pressed",j===i));
  document.getElementById("hubE").textContent=s.e;
  document.getElementById("hubN").textContent=nm;
  document.getElementById("infoSym").textContent=`${s.s}\uFE0E  ${nm}`;
  document.getElementById("infoDates").textContent=dt;
  document.getElementById("infoFact").textContent=fact;
  const hub=document.getElementById("hubE"); hub.classList.remove("pop"); void hub.offsetWidth; hub.classList.add("pop");
}
function relabelWheel(){
  spots.forEach((b,i)=>b.setAttribute("aria-label", lang==="sv"?HW[i].sv.n:SIGNS[i].n));
}
SIGNS.forEach((s,i)=>{
  const a=(90-i*30)*Math.PI/180, b=document.createElement("button");
  b.className="spot"; b.textContent=s.e; b.setAttribute("aria-label",s.n);
  b.style.left=(50+39*Math.cos(a))+"%"; b.style.top=(50-39*Math.sin(a))+"%";
  b.onclick=()=>pickSign(i); wheel.appendChild(b); spots.push(b);
});

/* finder */
const mSel=document.getElementById("mSel"), dSel=document.getElementById("dSel");
function populateMonths(){
  const keep=mSel.value;
  mSel.innerHTML="";
  (lang==="sv"?MONTHS_SV:MONTHS).forEach((m,i)=>mSel.add(new Option(m,i+1)));
  if(keep) mSel.value=keep;
}
function fillDays(){
  const keep=+dSel.value||1; dSel.innerHTML="";
  for(let d=1;d<=MDAYS[mSel.value-1];d++) dSel.add(new Option(d,d));
  dSel.value=Math.min(keep,MDAYS[mSel.value-1]);
}
mSel.onchange=fillDays;
function renderFound(){
  const m=+mSel.value, d=+dSel.value, idx=signFor(m,d), s=SIGNS[idx];
  const nm = lang==="sv"?HW[idx].sv.n:SIGNS[idx].n;
  const dt = lang==="sv"?HW[idx].sv.d:SIGNS[idx].d;
  const fact = lang==="sv"?FACTS_SV[idx]:SIGNS[idx].f;
  const monthDisp = lang==="sv"?MONTHS_SV[m-1]:MONTHS[m-1];
  const r=document.getElementById("reveal");
  r.innerHTML=`<svg class="burst" viewBox="0 0 400 400" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true"><circle cx="200" cy="200" r="4" fill="none" stroke="#FFCF4D" stroke-width="6"/></svg>

  con:"Stjärnbilden heter Taurus, Oxen, och är stor och lätt att hitta på vinterhimlen – nummer 17 av 88. I den finns två berömda stjärnhopar: Hyaderna, som bildar det V som är tjurens ansikte, och Plejaderna (Sjustjärnorna), en tät klunga unga blå stjärnor. Aldebaran är dessutom ett hörn i Vintersexhörningen, ett stort mönster av sex starkt lysande stjärnor från flera olika stjärnbilder. I stjärnbilden syns bara tjurens framdel – resten är under vattnet i berättelsen.",
  myth:"Zeus blev förälskad i prinsessan Europa. För att komma nära henne förvandlade han sig till en vacker, snövit tjur som betade bland hennes fars kor. Europa vågade klappa tjuren och satte sig till slut upp på hans rygg. Då sprang han rakt ut i havet och simmade hela vägen till ön Kreta, där han visade vem han var. Europa blev drottning där, och världsdelen Europa är uppkallad efter henne. Zeus satte upp tjurens bild bland stjärnorna.",

  star:"Aldebaran",starInfo:"an orange giant that shines like the bull's eye. The name means “the follower” in Arabic, because it follows the Pleiades across the sky",

 sv:{n:"Tvillingarna",d:"21 maj – 20 juni",mean:"latin för tvillingarna",
  star:"Pollux",starInfo:"en orange jättestjärna. Tvillingstjärnan Castor ser ut som en stjärna men är egentligen sex stjärnor som kretsar runt varandra",
  con:"Stjärnbilden Gemini, Tvillingarna, är nummer 30 av 88. De två starkast lysande stjärnorna, Castor och Pollux, är tvillingarnas huvuden och syns tydligt bredvid varandra. Pollux ingår i det stora mönstret Vintersexhörningen tillsammans med stjärnor från andra stjärnbilder. Vid tvillingarnas fötter ligger stjärnhopen M35, och varje december kommer stjärnfallssvärmen Geminiderna, som ser ut att stråla ut just härifrån.",
  myth:"Kastor och Pollux var tvillingbröder, men bara Pollux var son till Zeus och därför odödlig. Bröderna gjorde allt tillsammans: de var med på jakten efter det gyllene skinnet och sades rädda sjömän i storm. När Kastor dödades i en strid ville Pollux inte leva vidare utan honom och bad Zeus att få dela med sig av sin odödlighet. Zeus lät dem dela på den – halva tiden i underjorden, halva tiden bland gudarna – och satte upp dem båda på himlen så att de aldrig skulle behöva skiljas åt.",

 en:{n:"Gemini",d:"21 May – 20 June",mean:"Latin for the twins",
  star:"Pollux",starInfo:"an orange giant star. Its twin Castor looks like one star but is really six stars orbiting each other",
  con:"The constellation Gemini, the Twins, is number 30 of 88. Its two brightest stars, Castor and Pollux, are the twins' heads and sit clearly side by side. Pollux is part of the big Winter Hexagon pattern together with stars from other constellations. At the twins' feet lies the star cluster M35, and every December the Geminid meteor shower seems to stream out from right here.",
  myth:"Castor and Pollux were twin brothers, but only Pollux was a son of Zeus and therefore immortal. The brothers did everything together: they joined the hunt for the golden fleece and were said to rescue sailors in storms. When Castor was killed in a fight, Pollux did not want to live on without him and asked Zeus to share his immortality. Zeus let them share it – half the time in the underworld, half among the gods – and placed them both in the sky so they would never be parted.",

 sv:{n:"Kräftan",d:"21 juni – 22 juli",mean:"latin för krabba eller kräfta",
  star:"Al Tarf",starInfo:"betyder ”ändan” på arabiska och sitter i en av krabbans ben. Ingen av stjärnorna lyser särskilt starkt",
  con:"Stjärnbilden Cancer, Kräftan, är den svagaste av alla stjärntecknens stjärnbilder – nummer 31 av 88 – och syns bara riktigt bra på en mörk himmel utan gatlyktor. Stjärnorna bildar ett upp-och-nedvänt Y. Mitt i stjärnbilden ligger Bikupan (M44), en öppen stjärnhop med ungefär tusen stjärnor som med blotta ögat ser ut som en liten dimma. Galileo var den förste som riktade ett teleskop mot dimman och såg att den bestod av stjärnor.",
  myth:"När hjälten Herakles kämpade mot det många­hövdade monstret Hydran skickade gudinnan Hera en jättelik krabba för att störa honom. Krabban nöp Herakles i foten mitt i striden, men han trampade sönder den. Hera var ändå tacksam för hjälpen och satte upp krabban bland stjärnorna – men eftersom den förlorade fick den bara svaga stjärnor.",

 en:{n:"Cancer",d:"21 June – 22 July",mean:"Latin for crab",
  star:"Al Tarf",starInfo:"means “the end” in Arabic and sits in one of the crab's legs. None of the stars here are very bright",
  con:"The constellation Cancer, the Crab, is the faintest of all the zodiac constellations – number 31 of 88 – and only shows up well in a dark sky without street lights. Its stars form an upside-down Y. In the middle lies the Beehive (M44), an open cluster of about a thousand stars that looks like a small patch of mist to the naked eye. Galileo was the first to point a telescope at that mist and see that it was made of stars.",
  myth:"While the hero Heracles was fighting the many-headed monster Hydra, the goddess Hera sent a giant crab to disturb him. The crab pinched Heracles' foot in the middle of the battle, but he crushed it underfoot. Hera was grateful for the help anyway and placed the crab among the stars – but since it lost, it only got faint ones.",

{lat:"Leo",gen:"Leonis",rank:12,hex:"#E8A33D",
 sv:{n:"Lejonet",d:"23 juli – 22 augusti",mean:"latin för lejon",
  star:"Regulus",starInfo:"betyder ”den lille kungen” på latin. Den sitter längst ner i lejonets man och är en av himlens starkast lysande stjärnor",
  con:"Här finns flera svar. Stjärntecknet Lejonet hör ihop med stjärnbilden Leo, Lejonet, som är nummer 12 av 88 och lätt att hitta på vårhimlen. Inuti Leo finns ett mindre mönster som kallas Skäran: sex stjärnor som bildar lejonets huvud och man och ser ut som ett bakvänt frågetecken. Längst ner i Skäran sitter Regulus, och lejonets svans heter Denebola. Regulus ingår dessutom i ett ännu större mönster, Vårtriangeln, tillsammans med Arcturus och Spica från två andra stjärnbilder. I november kommer stjärnfallssvärmen Leoniderna från det här hållet.",
  myth:"Det nemeiska lejonet var ett monster med en päls som inga vapen kunde gå igenom. Herakles första uppgift av tolv var att döda det. När varken pilar eller klubba hjälpte gick han in i lejonets grotta och ströp det med sina bara händer. Sedan flådde han lejonet med dess egna klor, eftersom bara de var vassa nog, och bar skinnet som rustning med lejonhuvudet som hjälm. Zeus satte upp lejonet på himlen till minne av kampen.",
  tr:["självsäker","generös","varmhjärtad","stolt","gillar att synas","vill vara ledare"],el:"Eld",pl:"Solen",
  col:"guld och orange",stone:"peridot (olivin), ibland även rubin"},
 en:{n:"Leo",d:"23 July – 22 August",mean:"Latin for lion",
  star:"Regulus",starInfo:"means “the little king” in Latin. It sits at the bottom of the lion's mane and is one of the brightest stars in the sky",
  con:"There is more than one answer here. The sign Leo belongs with the constellation Leo, the Lion, number 12 of 88 and easy to find in the spring sky. Inside Leo there is a smaller pattern called the Sickle: six stars forming the lion's head and mane, shaped like a backwards question mark. Regulus sits at the bottom of the Sickle, and the lion's tail is called Denebola. Regulus is also part of an even bigger pattern, the Spring Triangle, together with Arcturus and Spica from two other constellations. In November the Leonid meteor shower comes from this direction.",
  myth:"The Nemean lion was a monster whose hide no weapon could pierce. Heracles' first task out of twelve was to kill it. When neither arrows nor club worked, he walked into the lion's cave and strangled it with his bare hands. He then skinned it using the lion's own claws, since only they were sharp enough, and wore the hide as armour with the lion's head as a helmet. Zeus placed the lion in the sky to remember the fight.",
  tr:["confident","generous","warm-hearted","proud","likes being seen","wants to lead"],el:"Fire",pl:"the Sun",
  col:"gold and orange",stone:"peridot, sometimes ruby"},

{lat:"Virgo",gen:"Virginis",rank:2,hex:"#3F5E7A",
 sv:{n:"Jungfrun",d:"23 augusti – 22 september",mean:"latin för jungfru, en ung kvinna",
  star:"Spica",starInfo:"betyder ”axet” på latin, alltså sädesaxet som jungfrun håller i handen. Det är en blåvit stjärna",
  con:"Stjärnbilden Virgo, Jungfrun, är störst av alla stjärntecknens stjärnbilder och näst störst av alla 88 – bara Vattenormen är större. Spica är ett hörn i det stora mönstret Vårtriangeln tillsammans med Regulus i Lejonet och Arcturus i Björnvaktaren. I riktning mot Jungfrun ligger också Virgohopen, en samling med över tusen galaxer. I en av dem, M87, togs världens första bild av ett svart hål år 2019.",
  myth:"Jungfrun brukar sägas vara skördegudinnan Demeter, eller hennes dotter Persefone, som var tvungen att tillbringa en del av året i underjorden – och då blev det vinter på jorden. Andra berättelser säger att hon är Astraia, rättvisans gudinna, som var den sista av gudarna att lämna jorden när människorna blev elaka mot varandra. Hon flög upp till himlen och blev en stjärnbild. Precis bredvid henne ligger Vågen, rättvisans vågskålar.",
  tr:["noggrann","hjälpsam","ordningsam","praktisk","ser detaljer","kan vara självkritisk"],el:"Jord",pl:"Merkurius",
  col:"mörkblå och jordbrun",stone:"safir (ibland även jade)"},
 en:{n:"Virgo",d:"23 August – 22 September",mean:"Latin for maiden, a young woman",
  star:"Spica",starInfo:"means “the ear of grain” in Latin – the wheat the maiden holds in her hand. It is a blue-white star",
  con:"The constellation Virgo, the Maiden, is the largest of all the zodiac constellations and the second largest of all 88 – only Hydra is bigger. Spica is a corner of the big Spring Triangle together with Regulus in Leo and Arcturus in Boötes. In the direction of Virgo lies the Virgo Cluster, a group of more than a thousand galaxies. In one of them, M87, the world's first picture of a black hole was taken in 2019.",
  myth:"The Maiden is usually said to be Demeter, goddess of the harvest, or her daughter Persephone, who had to spend part of every year in the underworld – and that is when winter came to Earth. Other stories say she is Astraea, goddess of justice, the last of the gods to leave Earth when people turned cruel to each other. She flew up to the sky and became a constellation. Right next to her lies Libra, the scales of justice.",
  tr:["careful","helpful","organised","practical","notices details","can be hard on herself"],el:"Earth",pl:"Mercury",
  col:"dark blue and earth brown",stone:"sapphire (sometimes jade)"},

{lat:"Libra",gen:"Librae",rank:29,hex:"#E9A2C1",
 sv:{n:"Vågen",d:"23 september – 22 oktober",mean:"latin för våg eller vågskål",
  star:"Zubeneschamali",starInfo:"betyder ”den norra klon” på arabiska – ett minne av att stjärnan en gång tillhörde Skorpionen",
  con:"Ja, och det är extra spännande för just det här tecknet. Stjärnbilden Libra, Vågen, är nummer 29 av 88 och är det enda stjärntecknet som inte är ett levande väsen. Förr var de här stjärnorna ingen egen stjärnbild alls, utan skorpionens klor – grekerna kallade dem Chelae, ”klorna”. Stjärnornas namn minns det fortfarande: Zubenelgenubi betyder ”den södra klon” och Zubeneschamali ”den norra klon”. Det var romarna som gjorde om klorna till en våg.",
  myth:"Vågen är rättvisans vågskålar, som hålls av gudinnan Astraia – alltså Jungfrun, stjärnbilden bredvid. Med vågen vägde hon människornas goda och onda handlingar mot varandra. I det gamla Babylonien var vågen symbol för solguden Shamash, som var domare och vakade över rättvisan. Att just den här delen av himlen blev en våg passade bra: förr inföll höstdagjämningen här, den dag då dag och natt är precis lika långa – i balans.",
  tr:["rättvis","diplomatisk","sällskaplig","charmig","gillar harmoni och vackra saker","svårt att bestämma sig"],el:"Luft",pl:"Venus",
  col:"ljusrosa och ljusblå",stone:"opal (ibland även lapis lazuli)"},
 en:{n:"Libra",d:"23 September – 22 October",mean:"Latin for scales or balance",
  star:"Zubeneschamali",starInfo:"means “the northern claw” in Arabic – a memory of the time this star belonged to Scorpius",
  con:"Yes, and for this sign the answer is extra interesting. The constellation Libra, the Scales, is number 29 of 88 and is the only zodiac sign that is not a living creature. Long ago these stars were not a constellation of their own at all, but the claws of the scorpion – the Greeks called them Chelae, “the claws”. The star names still remember it: Zubenelgenubi means “the southern claw” and Zubeneschamali “the northern claw”. It was the Romans who turned the claws into a pair of scales.",
  myth:"Libra is the scales of justice, held by the goddess Astraea – that is, Virgo, the constellation next door. On them she weighed people's good and bad deeds against each other. In ancient Babylon the scales were the symbol of the sun god Shamash, who was a judge and watched over justice. It suited this part of the sky well: the autumn equinox used to fall here, the day when day and night are exactly the same length – in balance.",
  tr:["fair","diplomatic","sociable","charming","loves harmony and beautiful things","finds it hard to decide"],el:"Air",pl:"Venus",
  col:"light pink and light blue",stone:"opal (sometimes lapis lazuli)"},
 map:{s:[[158,238,6],[190,150,7],[292,196,5],[116,298,4],[300,278,4]],
  l:[[3,0],[0,1],[1,2],[2,0],[2,4]],

{lat:"Scorpio",gen:"Scorpii",rank:33,hex:"#8E2B33",
 sv:{n:"Skorpionen",d:"23 oktober – 21 november",mean:"latin för skorpion. Tecknet heter Scorpio, men själva stjärnbilden heter Scorpius – astrologer och astronomer stavar det lite olika",
  star:"Antares",starInfo:"en röd superjätte och skorpionens hjärta. Namnet betyder ”Ares motståndare”, alltså Mars motståndare, eftersom den lyser lika röd som planeten Mars",
  con:"Stjärnbilden Scorpius, Skorpionen, är nummer 33 av 88 men en av de vackraste – stjärnorna bildar verkligen en skorpion med lång, krökt svans. Från Sverige syns den lågt i söder på sommaren. Antares är så stor att den skulle sluka Mars bana om den låg där solen ligger. Skorpionen ligger mitt i Vintergatan, åt det håll där vår galax mitt finns, och är därför full av stjärnhopar. Och kom ihåg: skorpionens klor är i dag en egen stjärnbild – Vågen.",
  myth:"Jägaren Orion skröt om att han kunde döda alla djur på jorden. Då skickade jordgudinnan Gaia en skorpion, som stack honom i hälen så att han dog. I en annan version är det gudinnan Artemis som skickar skorpionen. Båda sattes upp på himlen, men på var sin sida: därför går Orion ner i väster precis när Skorpionen stiger upp i öster. De möts aldrig.",
  tr:["intensiv","målmedveten","lojal","hemlighetsfull","stark vilja","ger sig inte"],el:"Vatten",pl:"Pluto (förr Mars)",
  col:"mörkröd och svart",stone:"topas (ibland även granat)"},
 en:{n:"Scorpio",d:"23 October – 21 November",mean:"Latin for scorpion. The sign is spelled Scorpio, but the constellation is Scorpius – astrologers and astronomers spell it differently",

  con:"The constellation Scorpius, the Scorpion, is number 33 of 88 but one of the most beautiful – the stars really do form a scorpion with a long curved tail. From Sweden it sits low in the south in summer. Antares is so large that if it stood where the Sun is, it would swallow the orbit of Mars. Scorpius lies in the Milky Way, in the direction of the centre of our galaxy, so it is full of star clusters. And remember: the scorpion's claws are now a constellation of their own – Libra.",

let hwIdx=4, hwTouched=false, wheelIdx=0, foundIdx=null;
const L=o=>typeof o==="function"?o:o[lang];

function applyStatic(){
  document.querySelectorAll("[data-sv]").forEach(el=>{ el.innerHTML=el.dataset[lang]; });
  document.querySelectorAll(".slide").forEach(s=>{ s.lang=lang; });
  document.getElementById("lbSv").setAttribute("aria-pressed",lang==="sv");
  document.getElementById("lbEn").setAttribute("aria-pressed",lang==="en");
  document.getElementById("nextBtn").textContent = cur===slides.length-1?NAV.again[lang]:NAV.next[lang];
  document.getElementById("myAnswer").placeholder=L(UI.answerPh);
  document.getElementById("daySlider").setAttribute("aria-label", lang==="sv"?"Flytta dig genom året":"Move through the year");
  document.getElementById("leoSvg").setAttribute("aria-label", lang==="sv"?"Stjärnor som binds ihop till formen av Lejonet":"Stars being joined into the shape of Leo the lion");
  document.getElementById("orbitSvg").setAttribute("aria-label", lang==="sv"?"Jorden rör sig runt solen, med de 12 stjärntecknen i en ring runt dem":"Earth moving around the Sun, with the 12 zodiac constellations in a ring around them");
  [...dots.children].forEach((b,i)=>b.setAttribute("aria-label", `${lang==="sv"?"Kapitel":"Chapter"} ${i+1}`));
}

function renderQList(){
  document.getElementById("qlist").innerHTML=Q.map((q,i)=>
    '<li><span class="num">'+(i+1)+'</span><span>'+q[lang]+'</span></li>').join("");
  document.getElementById("q6q").textContent="6. "+Q[5][lang];
}

function renderChips(){
  document.getElementById("hwChips").innerHTML=HW.map((d,i)=>
    '<button class="chip" data-i="'+i+'" aria-pressed="'+(i===hwIdx)+'"><span class="em">'+SIGNS[i].e+
    '</span>'+d[lang].n+'</button>').join("");
  document.querySelectorAll("#hwChips .chip").forEach(b=>{
    b.onclick=()=>{ hwTouched=true; hwPick(+b.dataset.i); };
  });
}

function drawMap(){
  const d=HW[hwIdx], m=d.map, svg=document.getElementById("mapSvg");
  svg.setAttribute("aria-label",(lang==="sv"?"Stjärnbilden ":"The constellation ")+d[lang].n);
  let g='<text class="mapname" x="200" y="34" text-anchor="middle">'+d[lang].n+" · "+d.lat+"</text>";
  m.l.forEach((p,i)=>{
    const a=m.s[p[0]], b=m.s[p[1]];
    g+='<path class="link" pathLength="1" d="M'+a[0]+" "+a[1]+" L"+b[0]+" "+b[1]+
       '" style="animation-delay:'+(i*0.1).toFixed(2)+'s"/>';
  });
  m.s.forEach(s=>{ g+='<circle class="star'+(s[2]>=6?" big":"")+'" cx="'+s[0]+'" cy="'+s[1]+'" r="'+s[2]+'"/>'; });
  (m.t||[]).forEach(t=>{
    const txt=typeof t[2]==="string"?t[2]:t[2][lang];
    g+='<text class="maplabel" x="'+t[0]+'" y="'+t[1]+'" text-anchor="'+(t[3]||"middle")+'">'+txt+"</text>";
  });
  svg.innerHTML=g;
  const sky=document.getElementById("mapSky");
  sky.classList.remove("play"); void sky.offsetWidth; sky.classList.add("play");
  document.getElementById("mapCap").textContent=UI.mapCap[lang](d[lang].n,d.lat);
}

function card(num,body){
  return '<div class="qcard"><h3><span class="num">'+num+'</span><span>'+Q[num-1][lang]+
         "</span></h3>"+body+"</div>";
}
function row(k,v){ return "<dt>"+k+"</dt><dd>"+v+"</dd>"; }

function renderAnswers(){
  const d=HW[hwIdx], s=d[lang], sign=SIGNS[hwIdx];
  let h="";
  h+=card(1,'<dl class="kv">'+
    row("Latin","<b>"+d.lat+"</b> (genitiv: <i>"+d.gen+"</i>)")+
    row(L(UI.means),s.mean)+
    row(L(UI.symbol),sign.s+" "+sign.e)+
    row(L(UI.swedish),HW[hwIdx].sv.n)+
    row(L(UI.english),HW[hwIdx].en.n)+
    row(L(UI.dates),s.d)+
    '</dl><p class="note">'+L(UI.latinNote)+"</p>");

  h+=card(2,"<p>"+s.con+'</p><dl class="kv">'+
    row(L(UI.constell),d.lat+" – "+s.n)+
    row(L(UI.size),UI.sizeVal[lang](d.rank))+
    row(L(UI.brightest),"<b>"+s.star+"</b> – "+s.starInfo)+
    "</dl>");

  h+=card(3,"<p>"+s.myth+'</p><p class="note">'+L(UI.ownWords)+"</p>");

  h+=card(4,'<div class="tags">'+s.tr.map(t=>'<span class="tag">'+t+"</span>").join("")+"</div>"+
    '<dl class="kv">'+row(L(UI.element),s.el)+row(L(UI.planet),s.pl)+'</dl><p class="note">'+
    L(UI.traitNote)+"</p>");

  h+=card(5,'<dl class="kv">'+
    row(L(UI.colour),'<span class="swatch" style="background:'+d.hex+'"></span>'+s.col)+
    row(L(UI.stone),s.stone)+
    row(L(UI.element),s.el)+
    '</dl><p class="note">'+L(UI.stoneNote)+"</p>");

  document.getElementById("answers").innerHTML=h;
}

    L(UI.ownPic)

  document.getElementById("checkList").innerHTML=UI.checks.map((c,i)=>

  document.getElementById("printHead").innerHTML=
    '<div style="display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid #888;padding-bottom:3mm;margin-bottom:4mm">'+
    "<strong>"+L(UI.printHead)+"</strong><span>"+L(UI.printLine)+"</span></div>";
}

function hwPick(i){
  hwIdx=i;
  document.querySelectorAll("#hwChips .chip").forEach(b=>
    b.setAttribute("aria-pressed", +b.dataset.i===i));
  drawMap(); renderAnswers(); renderSources();
}

function renderHW(){
  applyStatic(); renderQList(); renderChips(); drawMap(); renderAnswers(); renderSources();
  populateMonths(); fillDays(); relabelWheel(); pickSign(wheelIdx); updatePlayLabel(); drawOrbit();
  if(foundIdx!==null) renderFound();
}

function setLang(l){
  lang=l;
  try{ localStorage.setItem("zodiac-lang",l); }catch(e){}
  renderHW();
}
document.getElementById("lbSv").onclick=()=>setLang("sv");
document.getElementById("lbEn").onclick=()=>setLang("en");
document.getElementById("redrawMap").onclick=drawMap;

/* remember the child's own answer to question 6 */
const ta=document.getElementById("myAnswer");
try{ ta.value=localStorage.getItem("zodiac-answer")||""; }catch(e){}
ta.addEventListener("input",()=>{ try{ localStorage.setItem("zodiac-answer",ta.value); }catch(e){} });

document.getElementById("printBtn").onclick=()=>{
  const v=ta.value.trim();
  document.getElementById("myAnswerPrint").textContent=v||"";
  window.print();
};

/* the birthday finder also picks the sign for the homework */
document.getElementById("findBtn").addEventListener("click",()=>{
  if(!hwTouched) hwPick(signFor(+mSel.value,+dSel.value));
});

renderHW();
go(0);
requestAnimationFrame(tick);
</script>
</body>
</html>
