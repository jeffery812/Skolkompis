<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skolkompis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --bg:#FBF7F0;
    --card:#FFFFFF;
    --ink:#2B2320;
    --ink-soft:#7A6F63;
    --accent:#1F8A70;
    --accent-deep:#166B57;
    --amber:#F2A93B;
    --border:#E8E0D4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181310; --card:#231D19; --ink:#F4EFE9; --ink-soft:#B9AEA1;
      --accent:#3FBFA0; --accent-deep:#63D4B6; --amber:#F5BE5E; --border:#382F28;
    }
  }
  :root[data-theme="dark"]{
    --bg:#181310; --card:#231D19; --ink:#F4EFE9; --ink-soft:#B9AEA1;
    --accent:#3FBFA0; --accent-deep:#63D4B6; --amber:#F5BE5E; --border:#382F28;
  }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Nunito','Segoe UI',sans-serif; font-size:16px; line-height:1.6; }
  h1,h2{ font-family:'Fredoka','Baloo 2',system-ui,sans-serif; font-weight:600; margin:0; text-wrap:balance; }
  [hidden]{ display:none !important; }

  main{ max-width:760px; margin-inline:auto; padding:56px 20px 72px; }
  header{ margin-bottom:44px; }
  .eyebrow{ font-family:'Fredoka','Baloo 2',system-ui,sans-serif; color:var(--accent-deep); font-size:.85rem; letter-spacing:.06em; text-transform:uppercase; margin:0 0 10px; }
  h1{ font-size:clamp(2rem, 4vw + 1rem, 2.8rem); }
  .lede{ margin-top:12px; color:var(--ink-soft); max-width:56ch; font-size:1.05rem; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:18px; }

  .card{ display:flex; flex-direction:column; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:22px; text-decoration:none; color:inherit; transition:transform .15s ease, border-color .15s ease; }
  .card:hover{ transform:translateY(-2px); border-color:var(--accent); }
  .card:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }
  .card .icon{ font-size:2rem; line-height:1; }
  .card h2{ font-size:1.25rem; }
  .card p{ margin:0; color:var(--ink-soft); font-size:.92rem; }
  .card .go{ margin-top:auto; font-family:'Fredoka','Baloo 2',system-ui,sans-serif; color:var(--accent-deep); font-size:.9rem; }

  .placeholder{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border:2px dashed var(--border); border-radius:20px; padding:22px; color:var(--ink-soft); text-align:center; min-height:120px; }
  .placeholder .icon{ font-size:1.6rem; opacity:.7; }
  .placeholder p{ margin:0; font-size:.88rem; }

  footer{ margin-top:56px; color:var(--ink-soft); font-size:.85rem; }
  footer a{ color:var(--accent-deep); }
</style>
</head>
<body>

<main>
  <header>
    <p class="eyebrow">Skolkompis</p>
    <h1>Courseware &amp; School Tools</h1>
    <p class="lede">A growing collection of interactive lessons and games I build for my kids — pick one below to open it.</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    Source on <a href="https://github.com/jeffery812/Skolkompis">GitHub</a>.
  </footer>
</main>

<script>
  // Add a new entry here whenever a new piece of courseware is added.
  var PROJECTS = [
    {
      title: "Ride or Drive?",
      href: "ride-or-drive/index.html",
      icon: "🏍️🚗",
      desc: "An animated wheel-counting trick for the classic chicken-and-rabbit puzzle, plus 10 practice problems."
    },
    {
      title: "Robin kollar en tidsmaskin",
      href: "Robin-book/index.html",
      icon: "📖⏳",
      desc: "An interactive Swedish read-along storybook with narrated audio."
    }
  ];

  var grid = document.getElementById('grid');
  PROJECTS.forEach(function(p){
    var a = document.createElement('a');
    a.className = 'card';
    a.href = p.href;
    a.innerHTML =
      '<span class="icon">' + p.icon + '</span>' +
      '<h2>' + p.title + '</h2>' +
      '<p>' + p.desc + '</p>' +
      '<span class="go">Open →</span>';
    grid.appendChild(a);
  });

  var placeholder = document.createElement('div');
  placeholder.className = 'placeholder';
  placeholder.innerHTML = '<span class="icon">✦</span><p>More courseware coming soon</p>';
  grid.appendChild(placeholder);
</script>
</body>
</html>
